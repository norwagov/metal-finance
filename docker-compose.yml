# ─────────────────────────────────────────────────────────────────────────────
#  Metal Finance - rozliczenia wspólnych wyjazdów
#
#  Do postawienia aplikacji wystarczy TEN JEDEN PLIK (kod pobiera się z repozytorium):
#    1. skopiuj go na serwer do pustego katalogu jako docker-compose.yml
#    2. podmień adres repozytorium w `context:` i uzupełnij zmienne poniżej
#    3. docker compose up -d --build
#  Aplikacja: http://<serwer>:8080
#
#  Aktualizacja do najnowszej wersji z repo:  docker compose up -d --build
# ─────────────────────────────────────────────────────────────────────────────
services:
  metal-finance:
    build:
      # Repozytorium z kodem (#gałąź). Prywatne repo: https://<token>@github.com/<login>/<repo>.git#main
      context: https://github.com/TWOJ-LOGIN/metal-finance.git#main
    image: metal-finance:latest
    container_name: metal-finance
    restart: unless-stopped
    ports:
      - "8080:8000"
    environment:
      # Token SUBSKRYPCJI Claude (Pro / Max) - NIE klucz API pay-as-you-go.
      # Wygeneruj na komputerze z Claude Code poleceniem:  claude setup-token
      CLAUDE_CODE_OAUTH_TOKEN: ""
      # Hasło wspólne dla ekipy (puste = bez logowania - tylko w zaufanej sieci!)
      APP_PASSWORD: ""
      # Model do odczytu paragonów: opus | sonnet | haiku (albo pełna nazwa modelu)
      CLAUDE_MODEL: "opus"
      TZ: "Europe/Warsaw"
      # Za reverse proxy (nginx, Traefik, Caddy) ustaw na "1"
      TRUST_PROXY: "0"
    volumes:
      - metal-finance-data:/data   # baza SQLite + zdjęcia paragonów

volumes:
  metal-finance-data:
