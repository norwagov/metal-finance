{% extends 'base.html' %}
{% import '_macros.html' as m with context %}
{% block title %}Logowanie{% endblock %}
{% block content %}
<div class="row justify-content-center pt-5">
  <div class="col-12 col-sm-8 col-md-5 col-lg-4">
    <form method="post" class="card">
      {{ m.csrf() }}
      <div class="card-body text-center p-4">
        <img src="{{ url_for('static', filename='logo.svg') }}" width="64" height="64" alt="" class="mb-2">
        <div class="brand-word fs-2 mb-3">Metal Finance</div>
        <input class="form-control form-control-lg mb-3" type="password" name="password" placeholder="Hasło ekipy" autofocus required>
        <button class="btn btn-metal w-100 btn-lg">Wejdź 🤘</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
